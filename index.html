<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gesture Controlled 3D Viewer with Ollama</title>

  <!-- External Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- 3D Viewport -->
  <div id="viewport"></div>

  <!-- Control Panel & Assistant -->
  <aside id="sidebar">
    <section class="section">
      <h2>Gesture Control</h2>
      <button id="start-btn" type="button">Start Camera & Model</button>
      <div id="webcam-container"></div>
      <p class="status-label">Detected: <span id="status">Idle</span></p>
    </section>

    <hr />

    <section class="section chat-section">
      <h2>Ollama Assistant</h2>
      <div id="chat-box"></div>
      <div class="input-group">
        <input type="text" id="prompt-input" placeholder="Ask assistant about the 3D model..." />
        <button id="send-btn" type="button">Send</button>
      </div>
    </section>
  </aside>

  <!-- Application Logic -->
  <script src="app.js"></script>
</body>
</html>
